<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>آکادمی هوشمند یادگیری - مرحله ۱</title>
<link rel="stylesheet" href="5.css" data-academy-game-style>
<link rel="stylesheet" href="../academy-progress.css">
</head>
<body data-academy-game-id="noun-tap">
<div class="wrap">
<header>
<div><h1>🌟 آکادمی هوشمند یادگیری</h1><div class="small">مرحله ۱ — دسته‌بندی اسم‌ها</div></div>
<div class="stats"><div class="stat">مرحله ۱</div><div class="stat">امتیاز: <span id="score">۰</span></div><div class="stat">⭐ <span id="stars">۰</span></div></div>
</header>

<div class="grid">
<section class="panel">
<h2>🧩 واژه‌ها</h2>

<div id="words" class="words"></div>
<div class="actions"><button id="check">بررسی پاسخ‌ها ✓</button><button id="reset">شروع دوباره ↻</button></div>
<div id="msg"></div>
</section>

<section class="panel">
<h2>🎯 جای واژه‌ها</h2>
<div id="cats" class="categories"></div>
</section>
</div>
</div>

<div id="overlay" class="overlay"><div class="card">
<div class="stars">⭐⭐⭐⭐⭐</div><h2>آفرین! 🎉</h2>
<p>همهٔ واژه‌ها را درست دسته‌بندی کردی.</p><h3>امتیاز: <span id="final">۰</span></h3>
<button id="next" style="background:#3978ff;color:white">مرحله بعد 🚀</button>
</div></div><div id="rain" class="rain"></div>
