<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آزمون تعاملی فعل ماضی - پایه هفتم</title>
    <link rel="stylesheet" href="3.css" data-academy-game-style>
    <link rel="stylesheet" href="../academy-progress.css">
</head>
<body data-academy-game-id="past">
    <div class="container" id="app">
        <h1>آموزش و سنجش فعل ماضی (۱۴ صیغه)</h1>
        <div class="teacher-badge">طراح و مدرس: استاد غلامحسین جدایی | پایه هفتم</div>
        
        <div class="stats">
            <div>امتیاز: <span id="score">0</span></div>
            <div>سوال: <span id="question-num">1</span> / <span id="total-q">20</span></div>
        </div>

        <div class="question-box" id="question-text">در حال بارگذاری سوال...</div>

        <div class="options" id="options-container"></div>

        <div class="feedback" id="feedback"></div>
        <button class="next-btn" id="next-btn" onclick="nextQuestion()">سوال بعدی ⬅</button>
    </div>

    <script src="3.js" defer></script>
</body>
</html>
